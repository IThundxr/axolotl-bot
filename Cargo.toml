[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/backend",
    "crates/bot",
    "crates/database",
    "crates/database/entity",
    "crates/database/migration",
    "crates/macros",
]

[workspace.package]
version = "0.1.0"
authors = ["IThundxr"]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
axum-login = "0.18.0"
backend = { path = "crates/backend" }
bot = { path = "crates/bot" }
constant_time_eq = "0.5.0"
database = { path = "crates/database" }
database-entity = { path = "crates/database/entity" }
database-migration = { path = "crates/database/migration" }
dotenvy = "0.15.7"
headers = "0.4"
humantime = "2.4.0"
inventory = "0.3.24"
knus = { git = "https://github.com/TheLostLambda/knus.git", branch = "kdl2" }
macros = { path = "crates/macros" }
miette = { version = "7.6.0", features = ["fancy"] }
oauth2 = "5.0.0"
poise = "0.6.2"
reqwest = { version = "0.12.22", features = ["json"] }
sea-orm = { version = "2.0.0-rc.37", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = { version = "2.0.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["trace"] }
tower-sessions = "0.14.0"
tower-sessions-core = "0.14.0"
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
